---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: my-app-dev
  namespace: argocd
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL:  "https://github.com/Thaheer-Lepakshi/argocd.git"
    targetRevision: HEAD
    path: environments/staging/my-app-dev
  destination:
    server: 'https://kubernetes.default.svc'
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: true
    syncOptions:
     - validate=true
     - CreateNamespace=true
     - PrunePropagationPolicy=foreground
     - PruneLast=true

    